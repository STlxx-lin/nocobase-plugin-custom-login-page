name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release NocoBase Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: packages/plugins/@nocobase/plugin-custom-login-page

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Root package.json
        run: |
          cat << 'HEREDOC' > package.json
          {
            "name": "nocobase-build-env",
            "private": true,
            "workspaces": [
              "packages/*/*",
              "packages/*/*/*"
            ],
            "scripts": {
              "nocobase": "nocobase-v1"
            },
            "dependencies": {
              "@nocobase/app": "2.2.0-beta.15",
              "@nocobase/cli": "2.2.0-beta.15",
              "@nocobase/build": "2.2.0-beta.15",
              "@nocobase/devtools": "2.2.0-beta.15"
            },
            "resolutions": {
              "cytoscape": "3.28.0",
              "@types/react": "18.3.18",
              "@types/react-dom": "^18.0.0",
              "react-router-dom": "^6.30.1",
              "react-router": "^6.30.1",
              "antd": "5.24.2",
              "async": "^3.2.6",
              "rollup": "4.24.0",
              "semver": "^7.7.1"
            }
          }
          HEREDOC

      - name: Generate Configuration Files
        run: |
          cat << 'HEREDOC' > lerna.json
          {
            "version": "0.1.0",
            "npmClient": "yarn",
            "useWorkspaces": true
          }
          HEREDOC
          cat << 'HEREDOC' > tsconfig.json
          {
            "extends": "./tsconfig.paths.json",
            "compilerOptions": {
              "esModuleInterop": true,
              "moduleResolution": "node",
              "jsx": "react",
              "target": "esnext",
              "module": "esnext",
              "allowJs": true,
              "noUnusedLocals": false,
              "preserveConstEnums": true,
              "skipLibCheck": true,
              "sourceMap": true,
              "inlineSources": true,
              "resolveJsonModule": true,
              "declaration": true,
              "experimentalDecorators": true,
              "downlevelIteration": true,
              "baseUrl": "."
            },
            "exclude": [
              "node_modules",
              "**/dist",
              "**/lib",
              "**/*.js",
              "**/*.d.ts"
            ]
          }
          HEREDOC
          cat << 'HEREDOC' > tsconfig.paths.json
          {
            "compilerOptions": {
              "paths": {
                "@nocobase/plugin-custom-login-page/client": [
                  "packages/plugins/@nocobase/plugin-custom-login-page/src/client"
                ],
                "@nocobase/plugin-custom-login-page/client-v2": [
                  "packages/plugins/@nocobase/plugin-custom-login-page/src/client-v2"
                ],
                "@nocobase/plugin-custom-login-page/package.json": [
                  "packages/plugins/@nocobase/plugin-custom-login-page/package.json"
                ],
                "@nocobase/plugin-custom-login-page": [
                  "packages/plugins/@nocobase/plugin-custom-login-page/src"
                ]
              }
            }
          }
          HEREDOC

      - name: Create Env Files
        run: |
          touch .env
          touch .env.example
          touch .env.e2e.example
          touch .env.test.example

      - name: Cache Yarn Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-nocobase-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-nocobase-

      - name: Install Dependencies with Retry
        run: |
          yarn config set network-timeout 600000
          yarn config set registry https://registry.npmjs.org/
          
          n=0
          until [ "$n" -ge 4 ]
          do
            echo "Running yarn install (attempt $((n+1)))..."
            yarn install --network-timeout 600000 && break
            n=$((n+1))
            if [ "$n" -lt 4 ]; then
              echo "yarn install failed due to network/registry glitch, retrying in 5 seconds..."
              sleep 5
            else
              echo "ERROR: yarn install failed after 4 attempts."
              exit 1
            fi
          done

      - name: Get Plugin Version
        id: plugin_version
        run: |
          VERSION=$(node -p "require('./packages/plugins/@nocobase/plugin-custom-login-page/package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          mkdir -p /tmp/release-artifacts

      - name: Build Plugin
        run: |
          yarn nocobase build @nocobase/plugin-custom-login-page

      - name: Verify Build Artifacts & Package
        run: |
          cd packages/plugins/@nocobase/plugin-custom-login-page

          echo "=== Verifying Build Artifacts ==="
          test -f "server.js" || { echo "ERROR: server.js is missing!"; exit 1; }
          test -f "client.js" || { echo "ERROR: client.js is missing!"; exit 1; }
          test -f "client-v2.js" || { echo "ERROR: client-v2.js is missing!"; exit 1; }
          test -d "dist" || { echo "ERROR: dist directory not found!"; exit 1; }
          test -f "dist/server/index.js" || { echo "ERROR: dist/server/index.js is missing!"; exit 1; }
          test -f "dist/client/index.js" || { echo "ERROR: dist/client/index.js is missing!"; exit 1; }
          test -f "dist/client-v2/index.js" || { echo "ERROR: dist/client-v2/index.js is missing!"; exit 1; }

          echo "=== Packaging Files List ==="
          ls -la

          # 打包发布产物 tgz 与 zip（显式包含运行时与说明文件，彻底排除开发与临时文件）
          tar -czvf "/tmp/release-artifacts/plugin-custom-login-page-v${RELEASE_VERSION}.tgz" \
            package.json README.md README.en-US.md README_EN.md LICENSE server.js server.d.ts client.js client.d.ts client-v2.js client-v2.d.ts dist

          zip -r "/tmp/release-artifacts/plugin-custom-login-page-v${RELEASE_VERSION}.zip" \
            package.json README.md README.en-US.md README_EN.md LICENSE server.js server.d.ts client.js client.d.ts client-v2.js client-v2.d.ts dist

      - name: Generate Checksums
        run: |
          cd /tmp/release-artifacts
          sha256sum plugin-custom-login-page-v*.tgz plugin-custom-login-page-v*.zip > sha256sums.txt
          echo "=== Generated SHA256 Checksums ==="
          cat sha256sums.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-custom-login-page-v${{ steps.plugin_version.outputs.version }}
          path: |
            /tmp/release-artifacts/plugin-custom-login-page-v*.tgz
            /tmp/release-artifacts/plugin-custom-login-page-v*.zip
            /tmp/release-artifacts/sha256sums.txt
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.plugin_version.outputs.version) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Release v{0}', steps.plugin_version.outputs.version) }}
          draft: false
          prerelease: ${{ contains(steps.plugin_version.outputs.version, 'beta') || contains(steps.plugin_version.outputs.version, 'alpha') || contains(steps.plugin_version.outputs.version, 'rc') }}
          generate_release_notes: true
          files: |
            /tmp/release-artifacts/plugin-custom-login-page-v*.tgz
            /tmp/release-artifacts/plugin-custom-login-page-v*.zip
            /tmp/release-artifacts/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}